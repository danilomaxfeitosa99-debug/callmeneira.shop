    body { font-family: 'Inter', sans-serif; background-color: #09090b; color: #fafafa; }

<body class="min-h-screen pb-16">

  <!-- HEADER MINIMALISTA -->
  <header class="border-b border-zinc-800/80 bg-[#09090b]/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-[#FFE600] text-black font-black flex items-center justify-center text-sm">S</div>
        <span class="font-bold tracking-tight text-base">_shaidi_ <span class="text-[#FFE600]">SWIPE</span></span>
        <span class="text-[11px] bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded-full font-medium" id="badge-live">● Atualizado Hoje</span>
      </div>

      <div class="flex items-center gap-1 bg-zinc-900 p-1 rounded-lg border border-zinc-800">
        <button onclick="setLang('ru')" id="btn-ru" class="px-2.5 py-1 rounded text-xs font-semibold text-zinc-400">RU</button>
        <button onclick="setLang('pt')" id="btn-pt" class="px-2.5 py-1 rounded text-xs font-semibold bg-[#FFE600] text-black">PT</button>
      </div>
    </div>
  </header>

  <!-- TELA ÚNICA: BUSCA + FILTRO DE NICHO + CARDS -->
  <main class="max-w-5xl mx-auto px-4 pt-8">

    <!-- TÍTULO LIMPO -->
    <div class="mb-6">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight" id="main-title">Trends Crescentes & Anúncios do Dia</h1>
      <p class="text-sm text-zinc-400 mt-1" id="main-sub">Filtre pelo nicho do seu cliente e copie a estrutura validada em 1 clique.</p>
    </div>

    <!-- BARRA DE PESQUISA + PÍLULAS DE NICHO NA MESMA TELA -->
    <div class="flex flex-col sm:flex-row gap-3 mb-6">
      <div class="relative flex-1">
        <input 
          type="text" 
          id="search-input" 
          oninput="renderCards()" 
          placeholder="Buscar por nicho ou formato (ex: estética, dentista, print)..." 
          class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-4 pr-4 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-[#FFE600]"
        />
      </div>
    </div>

    <!-- FILTROS RÁPIDOS (1 CLIQUE) -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2 mb-6" id="filter-bar"></div>

    <!-- GRID DE SWIPE FILES (ESTILO PINTEREST / FOREPLAY) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="cards-grid"></div>

  </main>

  <!-- MODAL LIMPO DE 1-CLIQUE PARA COPIAR -->
  <div id="card-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-md w-full p-6 space-y-4">
      <div class="flex items-start justify-between gap-2">
        <div>
          <span id="m-tag" class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-[#FFE600] text-black"></span>
          <h3 id="m-title" class="text-lg font-bold mt-2"></h3>
        </div>
        <button onclick="closeModal()" class="text-zinc-500 hover:text-white text-lg font-bold">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div class="bg-zinc-950 border border-zinc-800/80 rounded-xl p-3.5">
          <div class="text-zinc-400 font-semibold mb-1" id="lbl-hook">🎬 Gancho & Estrutura Visual (Reels/Stories)</div>
          <p id="m-hook" class="text-zinc-100 leading-relaxed"></p>
        </div>

        <div class="bg-zinc-950 border border-zinc-800/80 rounded-xl p-3.5">
          <div class="text-zinc-400 font-semibold mb-1" id="lbl-ads">🎯 Como Impulsionar no Local (Meta & Google Ads)</div>
          <p id="m-ads" class="text-zinc-100 leading-relaxed"></p>
        </div>
      </div>

      <button onclick="copySwipe()" id="btn-copy" class="w-full bg-[#FFE600] text-black font-bold py-3 rounded-xl text-xs hover:opacity-90 transition">
        📋 Copiar Estrutura Completa
      </button>
    </div>
  </div>
